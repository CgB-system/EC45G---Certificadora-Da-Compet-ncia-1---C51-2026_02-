spring:
  config:
    import: "optional:file:./config/application-secrets.yml"

  web:
    resources:
      static-locations:
        - file:${user.dir}/../frontend/
        - file:${user.dir}/frontend/
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tedi}
    username: credencial
    password: credencial

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  data:
    web:
      pageable:
        max-page-size: 100

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: credencial
    password: credencial
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true

tedi:
  jwt:
    secret: credencial
    access-expiracao-segundos: 900
    refresh-expiracao-segundos: 604800

  google:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:}

  email:
    remetente: credencial

  dados:
    diretorio: ${TEDI_DADOS_DIR:./dados}

  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

  voluntario:
    status-inicial: ATIVO

server:
  error:
    include-stacktrace: never
